<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="头像占位图">
  <title>头像占位图 · 请替换为你自己的照片</title>
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="0.55" stop-color="#5f6ef5"/>
      <stop offset="1" stop-color="#8a5cf0"/>
    </linearGradient>
    <radialGradient id="aglow" cx="0.28" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="agrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#ag)"/>
  <rect width="400" height="400" fill="url(#agrid)"/>
  <rect width="400" height="400" fill="url(#aglow)"/>

  <!-- 装饰圆环 -->
  <circle cx="322" cy="86" r="58" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="322" cy="86" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <circle cx="72" cy="330" r="44" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- 人像剪影 -->
  <g fill="#ffffff" fill-opacity="0.92">
    <circle cx="200" cy="158" r="56"/>
    <path d="M95 392c0-62 47-104 105-104s105 42 105 104z"/>
  </g>

  <!-- 底部渐变遮罩，让人像自然融入 -->
  <rect y="300" width="400" height="100" fill="url(#ag)" opacity="0"/>
</svg>
